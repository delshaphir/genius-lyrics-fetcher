<html>
    <head>
        <style>
            * {
                font-family: monospace;
            }
            div#search {
                background-color: slateblue;
                text-align: center;
                margin: auto;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                padding: 10px;
            }
            div#lyrics {
                color: gray;
                font-size: 14pt;
                text-align: center;
                margin: auto;
                padding: 10px;
                position: relative;
                top: 80px;
            }
            button {
                background-color: slateblue;
                border: 2px dotted white;
                padding: 10px;
                outline: none;
                color: white;
            }
            button:hover {
                background-color: white;
                border: 2px solid white;
                color: slateblue;
                cursor: pointer;
            }
            input[type="text"] {
                background-color: transparent;
                font-size: 16pt;
                color: white;
                margin-bottom: 10px;
                outline: none;
                border: none;
                border-bottom: 2px solid white;
            }
        </style>
    </head>
    <body>
        <div>
            <div id="search">
                <input type="text" placeholder="song" autofocus/>
                <button>get lyrics</button>
            </div>
            <div id="lyrics">
            </div>
        </div>
    </body>
</html>
